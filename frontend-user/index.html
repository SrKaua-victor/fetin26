<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>BusTrack — Mobilidade urbana em tempo real</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- VLibras: tradutor de Libras do governo federal (vlibras.gov.br).
         O plugin procura estes elementos pelos atributos vw-*, então a marcação
         precisa existir antes de ele ser inicializado. -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js" defer></script>
    <script>
      // Recurso de terceiro, carregado de fora: se o servidor do governo estiver
      // fora do ar ou bloqueado na rede do passageiro, o mapa tem que continuar
      // funcionando. Sem esta checagem o acesso a VLibras lançaria e derrubaria
      // o restante do script da página.
      window.addEventListener("load", function () {
        if (window.VLibras) {
          new window.VLibras.Widget("https://vlibras.gov.br/app");
        }
      });
    </script>
  </body>
</html>
